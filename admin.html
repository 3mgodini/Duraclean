<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duraclean Admin Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body{font-family:Inter,sans-serif;background:#111;color:#fff;margin:0;padding:20px}
    .wrap{max-width:980px;margin:0 auto}
    .card{background:#1b1b1b;border:1px solid #2f2f2f;border-radius:16px;padding:16px;margin-bottom:14px}
    input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid #3d3d3d;background:#0f0f0f;color:#fff;margin-top:8px}
    button{border:0;background:#d9b278;color:#18120b;padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .hidden{display:none}
    .post{border-top:1px solid #2a2a2a;padding-top:10px;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Duraclean Admin Studio</h1>
    <div id="login" class="card">
      <h3>Admin Login</h3>
      <p>Simple passcode gate for non-technical editing.</p>
      <input id="pass" type="password" placeholder="Enter admin passcode" />
      <button id="loginBtn">Open Dashboard</button>
    </div>

    <section id="dash" class="hidden">
      <div class="card">
        <h3>Post a Blog / Vlog / Gallery Update</h3>
        <div class="grid">
          <label>Type
            <select id="type"><option>blog</option><option>vlog</option><option>photo</option></select>
          </label>
          <label>Title<input id="title" placeholder="Post title" /></label>
        </div>
        <label>Content<textarea id="content" rows="4" placeholder="Write a short caption or blog summary"></textarea></label>
        <label>Image or Video URL<input id="media" placeholder="https://..." /></label>
        <button id="saveBtn">Publish to Website</button>
      </div>
      <div class="card">
        <h3>Published Feed</h3>
        <div id="posts"></div>
      </div>
    </section>
  </div>

<script>
const ADMIN_PASS='duraclean-admin';
const login=document.getElementById('login');
const dash=document.getElementById('dash');
const postsEl=document.getElementById('posts');

function getPosts(){ return JSON.parse(localStorage.getItem('duraclean_posts')||'[]'); }
function setPosts(posts){ localStorage.setItem('duraclean_posts', JSON.stringify(posts)); }
function render(){
  const posts=getPosts();
  postsEl.innerHTML = posts.length ? posts.map(p=>`<div class="post"><strong>${p.title}</strong> <small>(${p.type})</small><p>${p.content}</p>${p.media?`<a href="${p.media}" target="_blank">Open media</a>`:''}</div>`).join('') : '<p>No posts yet.</p>';
}

document.getElementById('loginBtn').onclick=()=>{
  if(document.getElementById('pass').value===ADMIN_PASS){login.classList.add('hidden');dash.classList.remove('hidden');render();}
  else alert('Wrong passcode');
};

document.getElementById('saveBtn').onclick=()=>{
  const post={type:type.value,title:title.value,content:content.value,media:media.value,date:new Date().toISOString()};
  const posts=getPosts();posts.unshift(post);setPosts(posts);render();
  title.value='';content.value='';media.value='';
};
</script>
</body>
</html>
