<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Before post-construction cleanup</title>
  <desc id="desc">A Durban hillside home exterior before cleaning, with building buckets, bricks, mud, and construction residue at sunset.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6c27a"/><stop offset=".35" stop-color="#d46a3e"/><stop offset="1" stop-color="#313744"/></linearGradient>
    <linearGradient id="wall" x1="0" x2="1"><stop offset="0" stop-color="#8e8781"/><stop offset="1" stop-color="#3e3e42"/></linearGradient>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/><feColorMatrix type="saturate" values="0.18"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="150" cy="330" r="70" fill="#ffd06a" opacity=".92"/>
  <path d="M0 520 C220 470 420 555 650 500 C760 475 900 500 1040 475 C1200 445 1380 500 1600 460 L1600 900 L0 900 Z" fill="#38414d" opacity=".65"/>
  <g opacity=".45" fill="#6f7684"><rect x="500" y="430" width="38" height="92"/><rect x="550" y="455" width="28" height="70"/><rect x="610" y="410" width="42" height="112"/><rect x="676" y="450" width="28" height="78"/></g>
  <rect x="0" y="575" width="1600" height="325" fill="#5f4b3d" filter="url(#rough)"/>
  <polygon points="690,120 1600,0 1600,820 620,820 620,250" fill="url(#wall)"/>
  <polygon points="640,250 1600,85 1600,130 680,305" fill="#201d1d"/>
  <rect x="800" y="285" width="170" height="235" fill="#111820"/><rect x="815" y="305" width="140" height="190" fill="#2b333b" opacity=".55"/>
  <rect x="1070" y="210" width="145" height="330" fill="#16191f"/><rect x="1086" y="235" width="112" height="270" fill="#2c3339" opacity=".55"/>
  <rect x="1325" y="195" width="190" height="360" fill="#11141a"/><rect x="1345" y="225" width="150" height="300" fill="#2c3339" opacity=".5"/>
  <rect x="760" y="535" width="820" height="75" fill="#9c9188" opacity=".72"/>
  <rect x="700" y="612" width="900" height="105" fill="#54443a" filter="url(#rough)"/>
  <g fill="#865642"><rect x="500" y="655" width="58" height="35"/><rect x="560" y="656" width="62" height="35"/><rect x="620" y="654" width="60" height="35"/><rect x="530" y="620" width="64" height="34"/><rect x="596" y="620" width="58" height="34"/><rect x="566" y="585" width="62" height="34"/></g>
  <path d="M110 720 L390 690 L440 760 L115 792 Z" fill="#6b5547" opacity=".9"/><path d="M80 825 C170 790 310 835 430 800 C600 755 800 780 940 825 C760 885 390 875 80 825Z" fill="#2d261f" opacity=".7"/>
