  <g stroke="#2b2927" stroke-width="10" fill="none"><path d="M135 690 l-55 145"/><path d="M310 700 l75 135"/><circle cx="90" cy="848" r="28" fill="#3d3a35"/><circle cx="390" cy="848" r="28" fill="#3d3a35"/></g>
  <rect x="0" y="0" width="1600" height="900" fill="#000" opacity=".08"/>
